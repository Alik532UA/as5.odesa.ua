<!doctype html>
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />		<meta name="theme-color" content="#1B5E7B" />
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				var prefix = 'as5.odesa.ua_';
				var t = localStorage.getItem(prefix + 'theme') || localStorage.getItem('theme');
				if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.setAttribute('data-theme', 'dark');
					document.documentElement.classList.add('dark-theme');
					document.querySelector('meta[name="color-scheme"]').content = 'dark';
				} else {
					document.documentElement.setAttribute('data-theme', 'light');
					document.documentElement.classList.remove('dark-theme');
					document.querySelector('meta[name="color-scheme"]').content = 'light dark';
				}
				// Mark home page before JS hydration to avoid flash
				var p = window.location.pathname;
				var base = '/as5.odesa.ua';
				if (p === base + '/' || p === base || p === '/') {
					document.body.classList.add('page-home');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
