<!doctype html>
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			Маркер ідентичності сайту (CI-CD-AND-TOOLS-v9 § 1.11,
			`CI-E2E-TARGET-IDENTITY`). Playwright перевіряє порт ОДИН раз, перед
			запуском своєї команди, а команда тут починається зі збірки — тобто
			вікно, у яке сусідній проєкт встигає зайняти порт, відкрите на десятки
			секунд. `tests/identity.setup.ts` читає цей рядок із сервера й звіряє з
			`package.json`, щоб прогін проти чужого застосунку падав як помилка
			середовища, а не як «element(s) not found».
		-->
		<meta name="application-name" content="as5.odesa.ua" />
		<meta name="theme-color" content="#1B5E7B" />
		<meta name="color-scheme" content="light dark" />
		%sveltekit.head%
		<!--
			Анти-FOUC стоїть ПІСЛЯ %sveltekit.head% навмисно (SECURITY-v8 § 6.3).

			SvelteKit вставляє <meta http-equiv="Content-Security-Policy"> саме на
			місце %sveltekit.head%, а мета-політика діє лише на те, що йде ПІСЛЯ
			неї. Доти скрипт стояв вище — тобто політика його не покривала зовсім,
			і будь-який хеш для нього був би декоративним. Затримка від переїзду
			нульова: до цього місця в <head> кілька мета-тегів.

			Хеш цього блоку обчислюється зі вмісту ЦЬОГО файлу під час збірки
			(svelte.config.js), а не вписаний рядком: вписаний розійшовся б зі
			скриптом при першій же правці й зламав би сайт лише у збірці, не в dev.
			Тому будь-яка зміна нижче безпечна — хеш переїде разом із нею.
		-->
		<script>
			try {
				var prefix = 'as5.odesa.ua_';

				/*
				 * Клас, що ховає нативну смугу, СТАВИТЬСЯ ДО ПЕРШОГО КАДРУ
				 * (SCROLLBAR § 8.2). Інакше сторінка малюється з нативною смугою,
				 * а за мить її ховає гідрація — видимий стрибок ширини.
				 *
				 * SYNC: типове значення `custom` і умова `(hover: hover) and
				 * (pointer: fine)` продубльовані в `states/ui.svelte.ts` і
				 * `states/scrollbar.svelte.ts` — цей скрипт не може їх імпортувати.
				 * Розходження ловить `src/scrollbar-canon.test.ts`.
				 */
				var sb = localStorage.getItem(prefix + 'scrollbarMode') || 'custom';
				var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
				if (fine && sb === 'custom') {
					document.documentElement.classList.add('has-custom-scrollbar');
				}

				var t = localStorage.getItem(prefix + 'theme') || localStorage.getItem('theme');
				if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.setAttribute('data-theme', 'dark');
					document.documentElement.classList.add('dark-theme');
					document.querySelector('meta[name="color-scheme"]').content = 'dark';
				} else {
					document.documentElement.setAttribute('data-theme', 'light');
					document.documentElement.classList.remove('dark-theme');
					// `only light`, а не `light dark`: мета-тег мусить збігатися зі
					// звуженням у `styles/global.css`, інакше сторінка оголошує себе
					// світлою-без-темної й Android Chrome перемальовує її своєю Auto
					// Dark Theme (UI-UX-v9 `UIUX-ONLY-LIGHT`).
					document.querySelector('meta[name="color-scheme"]').content = 'only light';
				}
			} catch (e) {}
		</script>
		<!--
			Правило приховування — ТУТ, а не в `global.css` (SCROLLBAR § 8.3).

			Клас на першому кадрі без правила на першому кадрі не робить нічого: на
			dev-сервері стилі проєкту приїжджають через JS і запізнюються, тож
			сторінка встигає намалюватися з нативною смугою. Два рядки в `head`
			коштують дешевше за стрибок ширини на кожному завантаженні.
		-->
		<style>
			html.has-custom-scrollbar {
				scrollbar-width: none;
			}
			html.has-custom-scrollbar::-webkit-scrollbar {
				display: none;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
