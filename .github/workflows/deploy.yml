name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build_site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Гейти якості (CODE-QUALITY-v8 § 6.5, CI-CD-AND-TOOLS-v8 § 1.4) ---
      # До цього пайплайн був install -> build -> deploy: 52 тести існували в
      # репозиторії і не виконувалися жодного разу.
      - name: Types and Svelte check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Поріг high, а не moderate: решта — два moderate у транзитивних
      # залежностях svelte-i18n, для яких npm пропонує «фікс» у вигляді
      # відкату на кілька мажорів назад. Такий гейт довелося б одразу
      # вимкнути, а вимкнений гейт гірший за відсутній: він створює враження,
      # що перевірка є (SECURITY-v8 § — HIGH, DEPENDENCIES-v8 § 3.1).
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      # Читає build/, а не src/: canonical на неіснуючу адресу і зниклий
      # sitemap.xml у джерелах виглядали правильно (SEO-v8 § 6.1,
      # AI-AGENT-PITFALLS-v8 § 2). Стоїть ПЕРЕД деплоєм, щоб зламана збірка
      # не доїхала до Pages.
      - name: Check build output
        run: npm run check:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build_site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
