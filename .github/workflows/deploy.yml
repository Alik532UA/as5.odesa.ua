name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# CI-CD-AND-TOOLS-v8 § 1.3. `cancel-in-progress: false` — не деталь смаку.
# Без групи пуш пачкою комітів дає стільки паралельних прогонів, скільки
# комітів; із групою й `true` усі проміжні скасовуються, лишається останній.
# У сусідніх проєктах саме так і сталося: прогін, який УПЕРШЕ виконав би
# щойно доданий гейт, не завершився ніколи — його скасували раніше, — і гейт
# кілька днів був червоним від народження, чого ніхто не бачив
# (AI-AGENT-PITFALLS-v8 § 1.4). Тут прогони шикуються в чергу й виконуються
# всі, тому кожен новий крок хоч раз, та побачать.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DEPENDENCIES-v8 § 2.3 — версія збігається з `engines.node` і `.nvmrc`;
      # узгодженість усіх трьох тримає інваріант `src/dependencies.test.ts`.
      #
      # Було 20. Node 20 вийшов із підтримки 2026-04-30 — оновлень безпеки для
      # нього більше немає, а локальна розробка йде на 25, тобто раннер лишався
      # єдиним місцем, де код виконує EOL-рантайм. Vite 7 вимагає
      # `^20.19 || >=22.12`, тож 22 — найближчий чинний LTS.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Гейти якості (CODE-QUALITY-v8 § 6.5, CI-CD-AND-TOOLS-v8 § 1.4) ---
      # До цього пайплайн був install -> build -> deploy: 52 тести існували в
      # репозиторії і не виконувалися жодного разу.
      - name: Types and Svelte check
        run: npm run check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      # `--omit=dev`, бо у браузер відвідувача їде лише прод-граф: вразливість
      # у `vite` чи `eslint` — це вразливість машини розробника, і гейт деплою
      # має падати не від неї (SECURITY-v8 § 9, canon GATE-AUDIT). Прапорець
      # `--production` тут НЕ підходить: із npm 9 він застарілий і мовчки
      # ігнорується — крок виглядав би тим самим і перевіряв би інше.
      #
      # Поріг high, а не moderate: решта — два moderate у транзитивних
      # залежностях svelte-i18n, для яких npm пропонує «фікс» у вигляді
      # відкату на кілька мажорів назад. Такий гейт довелося б одразу
      # вимкнути, а вимкнений гейт гірший за відсутній: він створює враження,
      # що перевірка є (DEPENDENCIES-v8 § 3.1).
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

      # Кеш браузерів між прогонами: `npm ci` їх не приносить, а
      # `playwright install` без кешу качає ~130 МБ щоразу.
      - name: Cache Playwright browsers
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      # axe над ЗІБРАНИМ сайтом (ACCESSIBILITY-v8 § 10, GATE-A11Y-AXE). До
      # 2026-08-23 цього гейта в проєкті не було зовсім — не «зелений», а
      # відсутній. Конфіг Playwright сам робить `npm run build` і піднімає
      # прев'ю, тож окремого кроку збірки тут не потрібно.
      - name: E2E — axe над зібраним сайтом
        if: ${{ !cancelled() }}
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build
        run: npm run build

      # Читає build/, а не src/: canonical на неіснуючу адресу і зниклий
      # sitemap.xml у джерелах виглядали правильно (SEO-v8 § 6.1,
      # AI-AGENT-PITFALLS-v8 § 2). Стоїть ПЕРЕД деплоєм, щоб зламана збірка
      # не доїхала до Pages.
      - name: Check build output
        run: npm run check:build

      # CI-CD-AND-TOOLS-v8 § 1.5 — єдина машинна перевірка правила «артефакт
      # збірки не комітиться» (VERSIONING-v8 § 1.4). Падає, якщо збірка
      # змінила відстежуваний файл: типово це згенерований `app-version.json`
      # із `buildTime` або підтягнутий lockfile. Зараз таких немає, і саме
      # тому крок дешевий: він фіксує чистий стан, а не розгрібає брудний.
      - name: Збірка не змінює відстежувані файли
        run: git diff --exit-code

      - name: Lighthouse Audit
        run: npx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build_site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
