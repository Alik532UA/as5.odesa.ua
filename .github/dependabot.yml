# DEPENDENCIES-v8 § 3.1 (DEP-DEPENDABOT, HIGH).
#
# Доти оновлення не відстежував ніхто: `npm audit` у CI бачить лише те, що вже
# має CVE, і мовчить про залежність, яка просто відстала на рік. Для static-
# профілю кожна прод-залежність — це чужий код у браузері відвідувача.
#
# Групування — головне тут, а не сам факт увімкнення. Патчі й мінори одним PR
# на тиждень: п'ятнадцять окремих PR щотижня перестають читати на другому
# тижні, і тоді гейт із тестами над ними нічого не вартий. Мажори — поодинці,
# бо саме там ламається сумісність, і при поломці має бути видно, від чого.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # Один PR на тиждень із безпечними оновленнями. CI над ним — той самий
      # повний набір гейтів: check, lint, test, audit, build, check:build.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Мажори Svelte, SvelteKit і Vite Dependabot не пропонує зовсім: канон
      # вимагає оновлювати їх ПООДИНЦІ й вручну, з ручною перевіркою після
      # (§ 3.2). Автоматичний PR тут створював би враження, що рішення просте.
      - dependency-name: 'svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/kit'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']

  # Самі GitHub Actions теж мають версії, і саме вони мають доступ до деплою.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
